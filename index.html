<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Anime Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1c1c1c;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .search {
            margin: 20px auto;
            max-width: 500px;
            display: flex;
        }

        .search input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .anime-card {
            background: #1c1c1c;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .anime-card h3 {
            margin-top: 0;
        }

        .episode {
            display: inline-block;
            background: #333;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <h1>My Anime Website</h1>
</header>

<div class="container">

    <div class="search">
        <input type="text" placeholder="Anime खोजें...">
    </div>

    <h2 class="section-title">Latest Episodes</h2>

    <div class="anime-card">
        <h3>My First Anime</h3>
        <p>Latest Anime Episodes</p>

        <span class="episode">Episode 1</span>
        <span class="episode">Episode 2</span>
        <span class="episode">Episode 3</span>
    </div>

    <div class="anime-card">
        <h3>Another Anime</h3>
        <p>New Episodes</p>

        <span class="episode">Episode 1</span>
        <span class="episode">Episode 2</span>
    </div>

</div>

<footer>
    © 2026 My Anime Website
</footer>

</body>
</html>
